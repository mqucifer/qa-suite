# QA's own pull request runs the tests it changes, against each project's main
# (mqucifer/crew#896).
#
# A test here runs on every pull request of its project once it merges (ADR 0006
# in mqucifer/project-print), so it's proven first: each project folder the pull
# request changes runs through `qa.yml`, as a delivery repository's pull request
# would, but against that project's main and with this pull request's tests. A
# red test comes back to QA before it can fail anyone else's pull request. A pull
# request that changes no project folder runs nothing, and passes.
#
# A dispute's pull request runs against the disputed pull request merged with the
# project's current main (mqucifer/crew#945): its fix can need the story's
# change, so against the story's head alone it could never pass once main moves.
# The crew writes the dispute in the pull request's body as
# `<!-- crew:qa-dispute repo=<project> story=<n> pull=<n> head=<sha> -->`; the
# disputed step checks out the pull request's head and merges the project's
# current main into it, publishing the result for the qa job to build. If the
# pull request can't merge cleanly with main, the run fails before any test
# executes. Only a pull request from this repository's own branches is read
# that way, never a fork's.

name: suite

on:
  pull_request:

permissions:
  contents: read

jobs:
  changed:
    runs-on: ubuntu-24.04
    outputs:
      projects: ${{ steps.find.outputs.projects }}
      disputed-repo: ${{ steps.disputed.outputs.repo }}
      disputed-head: ${{ steps.disputed.outputs.head }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the project folders it changes
        id: find
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A folder is a project's when it's at the top and isn't hidden; one
          # the pull request removes has nothing left to run.
          projects=$(git diff --name-only "$BASE...$HEAD" \
            | awk -F/ 'NF > 1 && $1 !~ /^\./ { print $1 }' \
            | sort -u \
            | while read -r folder; do [ -d "$folder" ] && echo "$folder"; done \
            | jq -R . | jq -sc .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Project folders changed: $projects" >> "$GITHUB_STEP_SUMMARY"

      - name: Find the pull request a dispute's test runs against
        id: disputed
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          found=$(printf '%s' "$BODY" \
            | grep -oE '<!-- crew:qa-dispute repo=[A-Za-z0-9._-]+ story=[0-9]+ pull=[0-9]+ head=[0-9a-f]{40} -->' \
            | tail -n 1 || true)
          if [ -z "$found" ]; then
            exit 0
          fi
          repo=$(printf '%s' "$found" | sed -E 's/.* repo=([^ ]+) .*/\1/')
          pull=$(printf '%s' "$found" | sed -E 's/.* pull=([0-9]+) .*/\1/')
          head_sha=$(printf '%s' "$found" | sed -E 's/.* head=([0-9a-f]{40}) .*/\1/')
          # Build the dispute's commit: the disputed pull request's head merged
          # with the project's current main, merged here so it is current
          # (mqucifer/crew#945). A conflict fails the run before any test.
          workdir=$(mktemp -d)
          git clone --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/mqucifer/${repo}.git" "$workdir"
          git -C "$workdir" fetch --quiet origin "$head_sha"
          git -C "$workdir" checkout --quiet "$head_sha"
          git -C "$workdir" fetch --quiet origin main
          main_sha=$(git -C "$workdir" rev-parse origin/main)
          if ! git -C "$workdir" merge origin/main --no-edit --quiet; then
            echo "::error::mqucifer/${repo}#${pull} can't merge with main (conflicts with ${main_sha:0:7}), so the build can't be started"
            exit 1
          fi
          merge_sha=$(git -C "$workdir" rev-parse HEAD)
          git -C "$workdir" push --quiet \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/mqucifer/${repo}.git" \
            "HEAD:refs/qa/dispute-${pull}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "head=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "A dispute: $repo/ runs against mqucifer/$repo#${pull} head ${head_sha:0:7} merged with main ${main_sha:0:7}, at ${merge_sha:0:7}." >> "$GITHUB_STEP_SUMMARY"

  # The suite's own structural tests: they read suite.yml and verify its dispute
  # handling is correct (mqucifer/crew#945). They need no project build—just the
  # workflow file and pytest—so they run on every pull request, independent of
  # which project folders it changes.
  meta:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --quiet
      - run: uv run pytest test_suite_yml.py

  qa:
    needs: changed
    if: needs.changed.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.changed.outputs.projects) }}
    uses: ./.github/workflows/qa.yml
    with:
      project: ${{ matrix.project }}
      build-repository: mqucifer/${{ matrix.project }}
      # The disputed pull request merged with main for its project's folder; main for any other.
      build-ref: ${{ matrix.project == needs.changed.outputs.disputed-repo && needs.changed.outputs.disputed-head || '' }}
      suite-ref: ${{ github.event.pull_request.head.sha }}
